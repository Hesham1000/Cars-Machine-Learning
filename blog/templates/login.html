{% extends 'navbar.html' %} {% block 'nav' %}
{% load static %}
<style>
  .auth-form {
    max-width: 360px;
    margin: 60px auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .auth-form h1 {
    text-align: center;
  }
  .auth-form input {
    padding: 10px;
    font-size: 16px;
  }
  .auth-form button {
    padding: 10px;
    font-size: 16px;
    cursor: pointer;
  }
  .auth-error {
    color: red;
    text-align: center;
  }
</style>
<form class="auth-form" method="POST">
  {% csrf_token %}
  <h1>Login</h1>
  {% if error %}
  <p class="auth-error">{{ error }}</p>
  {% endif %}
  <input type="text" name="username" placeholder="Username" required />
  <input type="password" name="password" placeholder="Password" required />
  <button type="submit">Login</button>
</form>
{% endblock %}
